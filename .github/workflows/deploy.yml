# Deploy to GitHub Pages workflow
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check undefined JSX
        run: npm run check:jsx-undefined

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for artifact availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for Pages artifact 'github-pages' to be indexed by GitHub API (Run ID: ${{ github.run_id }})..."
          MAX_RETRIES=12
          RETRY_INTERVAL=5
          FOUND=0

          for i in $(seq 1 $MAX_RETRIES); do
            ARTIFACTS_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" 2>/dev/null || true)
            if [ -n "$ARTIFACTS_JSON" ]; then
              ARTIFACT_ID=$(echo "$ARTIFACTS_JSON" | jq -r '.artifacts[]? | select(.name=="github-pages" and .expired==false) | .id' 2>/dev/null || true)
              if [ -n "$ARTIFACT_ID" ]; then
                echo "Artifact 'github-pages' found (Artifact ID: $ARTIFACT_ID). Ready for deployment."
                FOUND=1
                break
              fi
            fi
            echo "Attempt $i/$MAX_RETRIES: Artifact not visible yet in GitHub API. Waiting ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "Warning: Artifact not confirmed via GitHub API after $((MAX_RETRIES * RETRY_INTERVAL))s. Proceeding to deploy-pages directly."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
