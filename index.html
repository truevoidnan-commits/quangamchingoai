<!doctype html>
<html lang="vi" style="background-color: #0c121e; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Thiên Cơ Lâu – Trình đọc truyện chữ cá nhân, giao diện công nghệ pha cổ trang." />
    <meta name="theme-color" content="#101927" />
    <title>Thiên Cơ Lâu · Trình Đọc Truyện</title>
    <style>
      html, body {
        background-color: #0c121e;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <script>
      // Early Error Handler & SW Unregister to prevent blank screen
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }
      window.addEventListener('error', function(e) {
        console.error('[Top-level Error]', e);
        var root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          var errBox = document.getElementById('init-error-boundary');
          if (!errBox) {
            errBox = document.createElement('div');
            errBox.id = 'init-error-boundary';
            errBox.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0c121e;color:#fca5a5;padding:24px;z-index:999999;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;';
            errBox.innerHTML = '<div style="max-width:520px;background:#151f32;border:1.5px solid #ef4444;border-radius:14px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,0.85);text-align:center;">' +
              '<h3 style="color:#ef4444;margin:0 0 10px;font-size:18px;">⚠️ Phát Hiện Sự Cố Tải Giao Diện</h3>' +
              '<p style="font-size:13px;color:#cbd5e1;margin-bottom:12px;line-height:1.5;">' + (e.message || 'Lỗi tập lệnh') + '</p>' +
              '<p style="font-size:12px;color:#94a3b8;margin-bottom:20px;">' + (e.filename ? e.filename.split("/").pop() + ":" + e.lineno : '') + '</p>' +
              '<button onclick="localStorage.clear();sessionStorage.clear();if(window.indexedDB){indexedDB.deleteDatabase(\'tcl_image_cache_v1\');indexedDB.deleteDatabase(\'tcl_image_cache_v2\');}window.location.reload();" style="padding:11px 20px;background:#ef4444;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;">🧹 Khôi Phục Dữ Liệu & Tải Lại Trang</button>' +
              '</div>';
            document.body ? document.body.appendChild(errBox) : document.documentElement.appendChild(errBox);
          }
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body style="background-color: #0c121e;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
